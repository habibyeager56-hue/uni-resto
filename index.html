<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uni Resto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#0f2238;--mut:#5b6b7c;--blue:#1d5fa6;--red:#d2381e;--sun:#f2b632;--line:#d5dee6;--ok:#1f7a54;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1624;--card:#13233a;--ink:#e8eef5;--mut:#93a4b8;--blue:#5b9be0;--red:#ef6a52;--line:#25374f;--ok:#4cc08a}}
:root[data-theme="dark"]{--bg:#0c1624;--card:#13233a;--ink:#e8eef5;--mut:#93a4b8;--blue:#5b9be0;--red:#ef6a52;--line:#25374f;--ok:#4cc08a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,.brand,.big{font-family:'Bricolage Grotesque',Georgia,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;max-width:980px;margin:0 auto}
.brand{font-size:26px;font-weight:800;color:var(--blue);letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--red)}
nav{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:999px;border:1px solid var(--line)}
nav button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:500;color:var(--mut)}
nav button.on{background:var(--blue);color:#fff}
main{max-width:980px;margin:0 auto;padding:4px 20px 32px}
.phone{max-width:440px;margin:0 auto}
h2{font-size:19px;font-weight:700;margin:24px 0 10px}
.opt{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border:1.5px solid var(--line);background:var(--card);border-radius:12px}
.opt span{color:var(--mut);white-space:nowrap}
.on.opt,.on.slot,.on.pay{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.slot,.pay{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.slot small{font-weight:400;color:var(--mut)}
.slot:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px}.row .pay{flex:1}
.cta{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:17px}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{border:1.5px solid var(--line);background:none;border-radius:10px;padding:8px 14px;font-weight:500}
.note{color:var(--mut);font-size:14px}
.ticket{margin-top:12px;background:var(--card);border-radius:18px;border:1px solid var(--line);position:relative;overflow:hidden}
.ticket .top{padding:22px 22px 18px;border-top:8px solid var(--red)}
.ticket .top small{color:var(--mut)}
.big{font-size:46px;font-weight:800;line-height:1;margin:8px 0 6px;color:var(--blue)}
.perf{height:0;border-top:2px dashed var(--line);margin:0 18px;position:relative}
.perf:before,.perf:after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf:before{left:-30px}.perf:after{right:-30px}
.stub{padding:20px;text-align:center}
#qr{display:inline-block;padding:10px;background:#fff;border-radius:10px;line-height:0}
.code{font:700 15px ui-monospace,Menlo,monospace;letter-spacing:.12em;margin-top:8px}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--sun);color:#3a2a00}
.chip.ok{background:var(--ok);color:#fff}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font:800 34px 'Bricolage Grotesque',sans-serif;color:var(--blue)}
.kpi span{color:var(--mut);font-size:14px}
.term{background:#0b1320;color:#7be0a8;font-family:ui-monospace,Menlo,monospace;padding:18px;border-radius:14px;border:2px solid #22344d}
.term small{color:#7f93ab}.term strong{display:block;font-size:20px;margin-top:6px}
.term[data-s=no]{color:#ff9a8a}
.scan{display:flex;gap:8px;margin:12px 0}
.scan input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
.scan button{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:0 18px;font-weight:700}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--blue)}
.fc{display:flex;align-items:flex-end;gap:10px;height:160px;margin-top:10px}
.fc div{flex:1;text-align:center;font-size:13px;color:var(--mut)}
.fc i{display:block;background:var(--blue);border-radius:6px 6px 0 0;margin-bottom:4px}
.fc div:first-child i{background:var(--red)}
footer{max-width:980px;margin:0 auto;padding:0 20px 24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.ticket{animation:pop .35s ease-out}@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}}
.ar{font-family:Cairo,'Segoe UI',Tahoma,sans-serif;direction:rtl;unicode-bidi:isolate}
.who{display:flex;flex-direction:column;line-height:1.15}
.who .ar{font-size:15px;font-weight:600;color:var(--mut);margin-top:2px;text-align:left}
.menu{background:var(--card);border:1.5px solid var(--blue);border-radius:14px;padding:16px 18px}
.menu .d{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.menu ul{list-style:none;margin:10px 0 0;padding:0}
.menu li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.menu li .ar{color:var(--mut);text-align:right}
.price{font:800 28px 'Bricolage Grotesque',sans-serif;color:var(--red)}
.photo{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:50% 55%}
.photo.r{border-radius:14px;margin-top:8px}
.hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;background:#0f2238;padding:10px 0 34px;margin-bottom:8px}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,20,36,.5),rgba(8,20,36,.8))}
.slides{position:absolute;inset:0;z-index:-2}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;opacity:0}
.slides img:first-child{opacity:1}
.hero .brand{color:#fff;font-size:32px}.hero .brand i{color:var(--sun)}
.hero .who .ar{color:rgba(255,255,255,.92);font-size:19px}
.hero .tag{max-width:980px;margin:22px auto 0;padding:0 20px;font-size:18px;color:rgba(255,255,255,.94)}
.hero nav{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);backdrop-filter:blur(8px)}
.hero nav button{color:#fff}.hero nav button.on{background:#fff;color:#1d5fa6}
@media (prefers-reduced-motion:no-preference){
.slides img{animation:ken 30s infinite both}
@keyframes ken{0%{opacity:0;transform:scale(1)}4%{opacity:1}17%{opacity:1}22%{opacity:0;transform:scale(1.1)}100%{opacity:0;transform:scale(1.1)}}}
.menu{overflow:hidden}
.menu>img{display:block;width:calc(100% + 36px);margin:-16px -18px 14px;aspect-ratio:1.38;object-fit:cover}
.hl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
nav:empty{display:none}[hidden]{display:none!important}
.hero .ghost{color:#fff;border-color:rgba(255,255,255,.45)}
.fld{display:block;margin:0 0 12px;font-weight:500}
.fld input,.fld textarea,.cap{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:inherit;color:inherit}
.fld textarea{resize:vertical}
.cap{width:96px;margin:0;text-align:right}
.err{color:var(--red);font-weight:500}
a{color:var(--blue)}
.fld select{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:inherit;color:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{font:700 16px 'Bricolage Grotesque',sans-serif;margin:20px 0 8px;color:var(--mut)}
.camwrap{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1;max-width:360px;margin:10px auto}
#cam{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:18%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
#res{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;color:#fff;background:#1f7a54;padding:24px;cursor:pointer}
#res.no{background:#b3261e}
.em{font-size:clamp(96px,30vw,170px);line-height:1}
.rt{font:800 clamp(40px,10vw,64px)/1.1 'Bricolage Grotesque',sans-serif}
.rs{font:700 clamp(22px,6vw,32px) Figtree,sans-serif;margin-top:10px}
.rd{margin-top:6px;opacity:.92;font-size:18px}
@media (prefers-reduced-motion:no-preference){#res .em{animation:pop2 .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop2{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}}
.sc{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-weight:500;color:var(--mut);font-size:14px}
.bad{color:var(--red);font-weight:700}
#dm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:4px;padding:5px;border-radius:999px;background:#0f2238;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#dm button{border:0;background:none;color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;white-space:nowrap}
#dm button.on{background:var(--sun);color:#3a2a00}
body.demo main{padding-bottom:96px}
</style>

</head>
<body>
<div class="hero"><div class="slides" id="slides" aria-hidden="true"></div><header>
  <div class="who"><div class="brand">Uni<i>Resto</i></div><div class="ar" lang="ar">المطعم الجامعي بالقطب التكنولوجي بسوسة</div></div>
  <div class="hl"><nav id="nav" aria-label="View"></nav><button class="ghost" id="out" data-a="out" hidden>Sign out</button></div>

<main id="app"></main>
<div id="dm" hidden></div>

const unlock=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}};
function snd(ok){try{unlock();const t=AC.currentTime;(ok?[[880,0],[1318,.13]]:[[240,0],[190,.2]]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.28);o.start(t+d);o.stop(t+d+.32)});navigator.vibrate&&navigator.vibrate(ok?80:[120,60,120])}catch(e){}}
function flash(o){snd(o.ok);const r=$('#res');r.className=o.ok?'':'no';$('#rem').textContent=o.ok?'✅':'❌';$('#rt').textContent=o.t;$('#rs').textContent=o.s;$('#rd').textContent=o.d;r.hidden=false;clearTimeout(tm);tm=setTimeout(()=>{r.hidden=true},o.ok?2600:3400)}
function check(code){
  code=(code||'').trim().toUpperCase();if(!code)return;
  const r=S.res.find(x=>x.code===code&&x.st!=='x'),u=(r&&user(r.uid))||{};let o;
  if(!r)o={ok:0,t:'Not valid',s:'Unknown code',d:'Ask the student to open their ticket.'};
  else if(r.st==='u')o={ok:0,t:'Already used',s:uname(r.uid),d:'The '+r.slot+' ticket was scanned before.'};
  else{r.st='u';r.at=Date.now();rw(r);o={ok:1,t:'OK',s:uname(r.uid),d:[r.slot,PRICE.toFixed(3)+' TND paid',u.spec,u.year].filter(Boolean).join(' · ')}}
  S.term=o.ok?{s:'ok',msg:'OPEN · '+esc(o.s)+' · '+r.slot}:{s:'no',msg:'DENIED · '+esc(o.t)};
  flash(o);
}
async function camStart(){camMsg='';
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
  catch(e){stream=null;camMsg='The camera is blocked or not available here. Type the code instead.'}}

const cv=document.createElement('canvas');
function loop(){const v=$('#cam');if(!v||!stream)return;
  if(v.readyState>=2&&v.videoWidth&&window.jsQR){const w=Math.min(480,v.videoWidth),hh=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=hh;
    const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,hh);const r=jsQR(x.getImageData(0,0,w,hh).data,w,hh);
    if(r&&r.data){const n=Date.now();if(r.data!==last.c||n-last.t>3500){last={c:r.data,t:n};check(r.data);render();return}}}
  raf=requestAnimationFrame(loop)}
function syncCam(){const v=$('#cam');if(!v){if(stream)camStop();return}
  v.srcObject=stream;v.play().catch(()=>{});cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}

    wr('cfg/menu',{j:JSON.stringify({items:S.menu.items,caps:S.caps})});S.flash='Saved. Students now see the new plate and slot counts.';
  },
  reset(){S.res.forEach(r=>del('res/'+r.code));del('cfg/menu');del('cfg/photo');S.res=[];S.mine=null;S.caps={};S.menu={items:ITEMS,photo:null};S.sel={slot:null,pay:'e-Dinar'};S.term={s:'idle',msg:'Waiting for a QR code…'}}
};
document.addEventListener('click',async e=>{unlock();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;await A[b.dataset.a](b.dataset.v);render()});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
  if(e.target.id==='code'){A.scanin();render()}
  else if(/^(f-|pin|s-)/.test(e.target.id)){const c=$('.cta');if(c)c.click()}});
document.addEventListener('change',e=>{
  if(e.target.id!=='m-photo'||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const w=Math.min(640,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    A.savemenu();S.menu.photo=c.toDataURL('image/jpeg',.7);wr('cfg/photo',{p:S.menu.photo});S.flash='Photo updated and saved.';render()};im.src=r.result};
  r.readAsDataURL(e.target.files[0]);
});
document.addEventListener('change',e=>{
  const f=e.target.id==='q-photo'&&e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{const w=Math.min(1000,im.width),hh=Math.round(im.height*w/im.width);cv.width=w;cv.height=hh;
    const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,hh);
    const r=window.jsQR&&jsQR(x.getImageData(0,0,w,hh).data,w,hh);
    if(r&&r.data)check(r.data);else flash({ok:0,t:'No QR found',s:'Try a clearer, closer photo',d:'Or type the code.'});render()};
  im.src=URL.createObjectURL(f);e.target.value='';
});
addEventListener('hashchange',()=>{S.err='';render()});
const HERO=[IMG.plate,IMG.door,IMG.f[1],IMG.serve,IMG.f[2],IMG.f[3]];
$('#slides').innerHTML=HERO.map((s,i)=>`<img src="${s}" alt="" style="animation-delay:${i*5}s">`).join('');
render();
(async()=>{try{DB=await claude.use('db')}catch(e){DB=null}
 if(!DB)return;
 const ty=()=>{const a=document.activeElement;return stream||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='code')},rr=()=>{if(!ty())render()};
 DB.collection('res').onSnapshot(q=>{S.res=q.docs.map(d=>d.data());rr()},()=>{});
 DB.collection('users').onSnapshot(q=>{S.users=q.docs.map(d=>d.data());rr()},()=>{});
 DB.doc('cfg/menu').onSnapshot(q=>{try{const j=q.exists?JSON.parse(q.data().j):null;S.caps=j?.caps||{};S.menu.items=j?.items||ITEMS}catch(e){}rr()},()=>{});
 DB.doc('cfg/photo').onSnapshot(q=>{S.menu.photo=q.exists?q.data().p:null;rr()},()=>{});
})();
</script>
</body>
